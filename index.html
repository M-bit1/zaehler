<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zähler">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Zähler</title>
<style>
:root{--bg:#F1F3F2;--card:#fff;--ink:#14211F;--mut:#566562;--line:#E1E6E4;--seg:#E1E6E4;--c1:#8A5A00;--c2:#B23A0B;--c3:#9B1C1C;--c4:#1D5FA8;--inv:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#1A2320;--ink:#EEF3F1;--mut:#9AABA6;--line:#2B3733;--seg:#2B3733;--c1:#E0A63A;--c2:#F0875A;--c3:#F07A7A;--c4:#6FA8EB;--inv:#101614}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{padding:calc(env(safe-area-inset-top) + 20px) 16px calc(110px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0 4px;font-size:30px}
.sub{font-size:13px;color:var(--mut)}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lab{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;gap:8px 12px}
.big{font-size:22px;font-weight:700}.big small{font-size:14px;font-weight:400}
.stats{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:10px}.stats>div{flex:1}
.cmp{font-size:12px;color:var(--mut);margin-top:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;background:none;border:0;border-top:3px solid transparent;font-size:13px;color:var(--mut)}
nav button.on{font-weight:700;color:var(--ink);border-top-color:var(--ink)}
nav button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c2);margin-left:4px;vertical-align:middle}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:none;font-size:14px;color:var(--mut);padding:0 2px}
.seg button.on{background:var(--card);font-weight:700;color:var(--ink)}
label.f{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:0 16px;min-height:52px;gap:8px}
label.f input{border:0;background:none;text-align:right;width:150px;min-height:44px;outline:0}
.btn{min-height:52px;border:0;border-radius:12px;background:var(--ink);color:var(--inv);font-weight:700;font-size:17px;width:100%}
.btn.alt{background:var(--card);color:var(--ink);font-weight:600}
.ban{background:var(--card);border-radius:16px;padding:12px 12px 12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-left:4px solid var(--c2)}
.ban button{background:var(--ink);color:var(--inv);border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;white-space:nowrap}
.bars{display:flex;gap:8px;align-items:flex-end}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bv{font-size:11px;color:var(--mut)}
.vj{font-size:10px;color:var(--mut);margin-top:-4px}
.bb{height:130px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.bb div{border-radius:2px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);gap:8px}
.li .nm{flex:1;min-width:0}
.li button{background:none;border:0;color:var(--mut);font-size:19px;min-width:44px;min-height:44px}
.li input{width:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px;padding:0 8px;text-align:right;outline:0}
.dh{font-size:13px;font-weight:700;color:var(--mut);padding:14px 0 4px}.dh:first-of-type{padding-top:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:15px;align-items:baseline}
.kv .v{text-align:right;font-weight:600}
.kv .hr{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.mr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mr .nm{flex:1;min-width:0;font-size:15px}
.mr input{width:96px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px;padding:0 8px;text-align:right;outline:0}
.mr input.fk{width:62px}
.sbtn{background:var(--seg);border:0;border-radius:8px;min-height:40px;padding:0 10px;font-size:14px}
.swf{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.swf label.f{background:var(--card)}
.two{display:flex;gap:8px}
details.sec{background:var(--card);border-radius:16px;padding:0 16px}
details.sec>summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:22px;font-weight:400;color:var(--mut)}
details.sec[open]>summary::after{content:"−"}
.in{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.in label.f,.in .btn.alt{background:var(--bg)}
.in .seg{background:var(--seg)}
.blk{display:flex;flex-direction:column;gap:0;margin-top:6px}
.blk .lab{padding-bottom:6px}
.res{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.warn{color:var(--c2)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav><button data-a="tab" data-v="0">Übersicht</button><button data-a="tab" data-v="1">Erfassen</button><button data-a="tab" data-v="2">Verlauf</button><button data-a="tab" data-v="3">Einstellungen</button></nav>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<script>
const VERSION='3';
// Diagrammfarben: mittelhell, auf hellem und dunklem Hintergrund gut sichtbar (kein Schwarz/Weiß)
const HC=['#E8833A','#D8576B','#9B6BD3','#2BA89A','#4A90D9','#7FB03F'];
const M=[
{id:'st',n:'Strom Tag',s:'Tag',f:'strom',v:'strom',u:'kWh',d:0,cd:0,c:'#D99A2B'},
{id:'sn',n:'Strom Nacht',s:'Nacht',f:'strom',v:'strom',u:'kWh',d:0,cd:0,c:'#4A90D9'},
...['Bad','Toilette','Wohnzimmer','Esszimmer','Küche','Schlafzimmer'].map((r,i)=>({id:'h'+(i+1),n:'Heizung '+r,s:r,f:'heizung',v:'heizung',u:'Einh.',d:0,cd:0,c:HC[i]})),
{id:'ww',n:'Warmwasser Küche',s:'Warmwasser Küche',f:'wasser',v:'warm',u:'m³',d:3,cd:2,c:'#D8576B'},
{id:'kt',n:'Kaltwasser Toilette',s:'Kaltwasser Toilette',f:'wasser',v:'kalt',u:'m³',d:3,cd:2,c:'#4A90D9'},
{id:'kk',n:'Kaltwasser Küche',s:'Kaltwasser Küche',f:'wasser',v:'kalt',u:'m³',d:3,cd:2,c:'#2BA89A'}];
const V=[{k:'strom',n:'Strom',c:'--c1',t:'Strom'},{k:'heizung',n:'Heizung',c:'--c2',t:'Heizung'},{k:'warm',n:'Warmwasser',c:'--c3',t:'Warmw.'},{k:'kalt',n:'Kaltwasser',c:'--c4',t:'Kaltw.'}];
const F=[{k:'strom',n:'Strom',c:'--c1'},{k:'heizung',n:'Heizung',c:'--c2'},{k:'wasser',n:'Wasser',c:'--c4'}];
const DEF={k:'s',einzug:'',abrWH:'01-01',abrS:'01-01',iv:14,nr:{},fak:{},sw:[],tarif:[],absch:[],bonus:[],flaeche:'',vzHW:'',abr:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=(v,d)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fe=v=>fm(v,2)+' €';
const today=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dn=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const dl=s=>s.split('-').reverse().join('.');
const dsh=n=>{const s=dl(ds(n));return s.slice(0,6)+s.slice(8)};
const TD=()=>dn(today());
const mdn=(y,md)=>{let [m,d]=md.split('-').map(Number);if(m===2&&d===29)d=28;return Date.UTC(y,m-1,d)/864e5};
const yr=n=>new Date(n*864e5).getUTCFullYear();
const ml=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'short',year:'numeric'})};
let db,R=[],S={...DEF},MEMO={},tab=0,fc='strom',vc='strom',vm='m',fd=today(),so=null,ed=null,lim=40,ay=null;
const OPEN=new Set(['allg']);
let now=new Date(),Y=now.getFullYear(),Mo=now.getMonth();

/* ---------- Speicher ---------- */
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('zaehler',2);
q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('r'))d.createObjectStore('r',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('cfg'))d.createObjectStore('cfg',{keyPath:'k'})};
q.onblocked=()=>alert('Bitte die App einmal komplett schließen und neu öffnen.');
q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const st=(m,s='r')=>db.transaction(s,m).objectStore(s);
const pr=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const isD=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);
const fin=x=>x!==''&&x!==null&&typeof x!=='boolean'&&isFinite(x);
const nid=x=>String(x||Date.now()+Math.random());
const ABRK=['pH','gH','bH','pWW','gWW','bWW','pKW','bKW'];
// Bereinigt Einstellungen (auch aus alten Backups v1/v2, in denen neue Felder fehlen)
function fixS(s){s={...DEF,...(s&&typeof s==='object'?s:{})};s.k='s';
s.nr=s.nr&&typeof s.nr==='object'?{...s.nr}:{};s.fak=s.fak&&typeof s.fak==='object'?{...s.fak}:{};
s.sw=Array.isArray(s.sw)?s.sw.filter(x=>x&&M.some(m=>m.id===x.m)&&isD(x.d)&&fin(x.a)&&fin(x.n)).map(x=>({...x,id:nid(x.id),a:+x.a,n:+x.n})):[];
s.tarif=Array.isArray(s.tarif)?s.tarif.filter(t=>t&&isD(t.ab)&&fin(t.ap)&&fin(t.gp)).map(t=>({id:nid(t.id),ab:t.ab,ap:+t.ap,gp:+t.gp})):[];
s.absch=Array.isArray(s.absch)?s.absch.filter(t=>t&&/^\d{4}-\d{2}$/.test(t.ab)&&fin(t.eur)).map(t=>({id:nid(t.id),ab:t.ab,eur:+t.eur})):[];
s.bonus=Array.isArray(s.bonus)?s.bonus.filter(t=>t&&isD(t.d)&&fin(t.eur)).map(t=>({id:nid(t.id),d:t.d,eur:+t.eur})):[];
s.flaeche=fin(s.flaeche)&&+s.flaeche>0?+s.flaeche:'';s.vzHW=fin(s.vzHW)&&+s.vzHW>=0?+s.vzHW:'';
const ab={};if(s.abr&&typeof s.abr==='object')for(const y of Object.keys(s.abr)){const o=s.abr[y];if(!/^\d{4}$/.test(y)||!o||typeof o!=='object')continue;const c={};
ABRK.forEach(k=>{if(fin(o[k]))c[k]=+o[k]});if(o.w&&typeof o.w==='object'){const w={};M.forEach(m=>{if(m.f!=='strom'&&fin(o.w[m.id]))w[m.id]=+o.w[m.id]});if(Object.keys(w).length)c.w=w}
if(Object.keys(c).length)ab[y]=c}s.abr=ab;
if(!/^\d\d-\d\d$/.test(s.abrWH))s.abrWH='01-01';if(!/^\d\d-\d\d$/.test(s.abrS))s.abrS='01-01';
s.iv=[0,14,30].includes(+s.iv)?+s.iv:14;if(!isD(s.einzug))s.einzug='';return s}
const load=async()=>{R=await pr(st('readonly').getAll());S=fixS(await pr(st('readonly','cfg').get('s')));MEMO={}};
const saveS=async()=>{await pr(st('readwrite','cfg').put(S));MEMO={}};

/* ---------- Rechenlogik Verbrauch ---------- */
// Zeitpunkt einer Ablesung = Ende des Ablesetags. Der Stichtagswert vom 31.12. liegt damit genau auf dem Nullungszeitpunkt 01.01.
const MM=id=>M.find(m=>m.id===id);
const ser=id=>R.filter(x=>x.m===id).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function ev(id){const key='e'+id;if(MEMO[key])return MEMO[key];const m=MM(id);
const e=[...ser(id).map(r=>({k:'r',t:dn(r.d)+1,v:r.v,d:r.d,o:0})),...S.sw.filter(s=>s.m===id).map(s=>({k:'sw',t:dn(s.d)+1,a:s.a,v:s.n,d:s.d,o:-1}))];
if(m.f==='heizung'&&e.length){const y0=yr(Math.min(...e.map(x=>x.t))-1);
for(let y=y0;y<=Y+1;y++){const T=mdn(y,S.abrWH);if(T<=TD())e.push({k:'res',t:T,v:0,o:1})}}
e.sort((p,q)=>p.t-q.t||p.o-q.o);return MEMO[key]=e}
function walk(e){let p=null;const iv=[];for(const x of e){if(x.k==='res'){p={t:x.t,v:0};continue}
const end=x.k==='sw'?x.a:x.v;if(p&&x.t>p.t&&end>=p.v)iv.push({x:p.t,y:x.t,u:end-p.v});p=x}return{p,iv}}
const IV=id=>MEMO['i'+id]||(MEMO['i'+id]=walk(ev(id)).iv);
const lastPt=id=>{const e=ev(id).filter(x=>x.k!=='res');return e[e.length-1]};
const prevAt=(id,d)=>{const t=dn(d)+1;return walk(ev(id).filter(x=>x.k==='sw'?x.t<=t:x.t<t)).p};
const E0=()=>S.einzug?dn(S.einzug)+1:-1e9;
function use(id,a,b){a=Math.max(a,E0());if(b<=a)return null;let t=0,ok=false;
for(const i of IV(id)){const ov=Math.min(b,i.y)-Math.max(a,i.x);if(ov>0){ok=true;t+=i.u/(i.y-i.x)*ov}}return ok?t:null}
const fak=id=>MM(id).f==='heizung'?(+S.fak[id]||1):1;
const grp=(k,a,b)=>{let t=0,ok=false;M.filter(m=>m.v===k).forEach(m=>{const u=use(m.id,a,b);if(u!==null){t+=u*fak(m.id);ok=true}});return ok?t:null};
const gm=k=>M.filter(m=>m.v===k&&IV(m.id).length);
const cov=k=>Math.max(-1e9,...M.filter(m=>m.v===k).flatMap(m=>IV(m.id).map(i=>i.y)));
const covS=k=>{const g=gm(k);return g.length?Math.max(...g.map(m=>IV(m.id)[0].x)):null};
const covE=k=>{const g=gm(k);return g.length?Math.min(...g.map(m=>IV(m.id).at(-1).y)):null};
const covers=(k,x,y)=>{const g=gm(k);return g.length>0&&g.every(m=>IV(m.id)[0].x<=x+1&&IV(m.id).at(-1).y>=y)};
// Vorjahresverlauf nur nutzen, wenn mindestens etwa monatlich abgelesen wurde
const dense=(k,x,y)=>gm(k).every(m=>IV(m.id).every(i=>i.y<=x||i.x>=y||i.y-i.x<=62));
const mdk=k=>k==='strom'?S.abrS:S.abrWH;
const pstart=(md,k=0)=>{let y=Y;if(mdn(y,md)>TD())y--;return mdn(y-k,md)};
const pend=(md,a)=>mdn(yr(a)+1,md);
const plab=(md,a)=>{const y=yr(a);return md==='01-01'?''+y:(''+y).slice(2)+'/'+(''+(y+1)).slice(2)};
const D=(y,m)=>Date.UTC(y,m,1)/864e5;
const mon=(y,m)=>new Date(y,m,1).toLocaleDateString('de-DE',{month:'short'});
const unit=k=>M.find(m=>m.v===k||m.f===k).u,cdec=k=>M.find(m=>m.v===k).cd;
const sv=(v,k)=>v===null?'–':'+'+fm(v,cdec(k))+' '+unit(k);
const pc=(c,p)=>{const x=(c/p-1)*100;return(x>=0?'+':'−')+fm(Math.abs(x),0)+' %'};
function due(){if(!S.iv)return[];return F.filter(f=>{const d=M.filter(m=>m.f===f.k).map(m=>lastPt(m.id)).filter(Boolean).map(x=>x.d).sort().pop();return !d||TD()-dn(d)>=S.iv})}

/* ---------- Prognose ---------- */
// Typische Verteilung des Heizbedarfs (Promille je Monat, Jan–Dez)
const HW=[170,150,130,80,40,13.3,13.3,13.3,30,80,120,160];
const W=(x,y)=>{let t=0;for(let n=x;n<y;n++){const d=new Date(n*864e5),m=d.getUTCMonth();t+=HW[m]/new Date(Date.UTC(d.getUTCFullYear(),m+1,0)).getUTCDate()}return t};
function prog(k){const md=mdk(k),a0=pstart(md),b=pend(md,a0),a=Math.max(a0,E0()-1);
if(b<=a)return null;const s0=covS(k),e0=covE(k);
if(s0===null)return{a0,a,b,none:true};
const s=Math.max(a,s0),E=Math.min(b,TD()+1,e0);
if(!(E>s))return{a0,a,b,none:true};
const c=grp(k,s,E);if(c===null)return{a0,a,b,none:true};
const pa=pstart(md,1),off=a0-pa,prev=covers(k,pa,a0)&&pa>=E0()-1?grp(k,pa,a0):null;
let rest=0,how,r=null;
if(k==='heizung'){const pcv=covers(k,a-off,b-off)&&dense(k,a-off,b-off)?grp(k,s-off,E-off):null;
if(pcv>0){const f=c/pcv;rest=((grp(k,a-off,s-off)||0)+(grp(k,E-off,b-off)||0))*f;how='Vorjahresverlauf, angepasst an deinen aktuellen Trend'}
else{const w=W(s,E);rest=w>0?c/w*(W(a,s)+W(E,b)):0;how='typischer Heizverlauf über das Jahr'}}
else{const rs=Math.max(s0,E-365,E0()-1);r=(grp(k,rs,E)||0)/Math.max(1,E-rs);rest=r*((s-a)+(b-E));how=E-rs>=300?'Ø-Verbrauch der letzten 12 Monate':'Ø-Verbrauch seit Beginn der Ablesungen'}
return{a0,a,b,s,E,c,p:c+rest,prev,how,r,days:E-s}}
function months(a,b){const r=[],d=new Date(a*864e5),y=d.getUTCFullYear();let m=d.getUTCMonth();if(d.getUTCDate()!==1)m++;
for(let i=0;i<40;i++,m++){const n=Date.UTC(y,m,1)/864e5;if(n>=b)break;r.push({n,ym:ds(n).slice(0,7)})}return r}
const absAt=ym=>{const x=S.absch.filter(t=>t.ab<=ym).sort((p,q)=>p.ab<q.ab?-1:1).pop();return x?x.eur:0};
function sCost(P){if(!S.tarif.length||!P||P.none)return null;const T=[...S.tarif].sort((x,y)=>x.ab<y.ab?-1:1);
const seg=T.map((t,i)=>({x:i?dn(t.ab):-1e9,y:i<T.length-1?dn(T[i+1].ab):1e9,t}));
const ov=(x,y,z)=>Math.max(0,Math.min(y,z.y)-Math.max(x,z.x));let e=0,rem=0,g=0,gb=0;
for(const z of seg){const x=Math.max(P.s,z.x),y=Math.min(P.E,z.y);if(y>x)e+=(grp('strom',x,y)||0)*z.t.ap/100;
rem+=P.r*(ov(P.a,P.s,z)+ov(P.E,P.b,z))*z.t.ap/100;g+=ov(P.a,P.b,z)*z.t.gp/365;gb+=ov(P.a,P.E,z)*z.t.gp/365}
const ms=months(P.a,P.b),ab=ms.reduce((t,m)=>t+absAt(m.ym),0),abB=ms.filter(m=>m.n<=TD()).reduce((t,m)=>t+absAt(m.ym),0);
const bo=S.bonus.filter(x=>dn(x.d)>=P.a0&&dn(x.d)<P.b).reduce((t,x)=>t+x.eur,0),tot=e+rem+g;
return{bis:e+gb,tot,ab,abB,bo,saldo:tot-ab-bo,emp:ms.length?(tot-bo)/ms.length:null,n:ms.length}}
const lp=key=>{const ys=Object.keys(S.abr).filter(y=>fin(S.abr[y][key])).sort();return ys.length?{y:ys.at(-1),v:S.abr[ys.at(-1)][key]}:null};
const HWK={heizung:['pH','gH'],warm:['pWW','gWW'],kalt:['pKW',null]};
function hwCost(k,P){if(!P||P.none)return null;const [pk,gk]=HWK[k],p=lp(pk);if(!p)return null;const g=gk?lp(gk):null,fr=(P.b-P.a)/(P.b-P.a0);
return{tot:P.p*p.v+(g&&S.flaeche?g.v*S.flaeche*fr:0),y:p.y,gmiss:!!(g&&!S.flaeche)}}

/* ---------- Plausibilität ---------- */
function plaus(id,d,v){const m=MM(id),p=prevAt(id,d);if(!p||p.t===undefined||v<p.v)return'';const days=dn(d)+1-p.t;if(days<1)return'';
const iv=IV(id).filter(i=>i.y<=p.t&&i.x>=p.t-365),sd=iv.reduce((t,i)=>t+i.y-i.x,0),su=iv.reduce((t,i)=>t+i.u,0);if(sd<60||su<=0)return'';
const r0=su/sd,f=m.f==='heizung'?5:3,du=v-p.v;
return du>f*r0*days&&du>r0*7?m.s+': '+fm(du,m.d)+' '+m.u+' in '+days+' Tagen ist ungewöhnlich viel (sonst ca. '+fm(r0*days,m.d)+'). Tippfehler?':''}

else{const C=hwCost(k,P);if(C){rows.push(null,['<b>Kosten Prognose</b>',fe(C.tot)]);note='Mit den Preisen der Abrechnung '+plab(S.abrWH,mdn(+C.y,S.abrWH))+'. Die tatsächlichen Preise stehen erst mit der nächsten Abrechnung fest.'+(C.gmiss?' Für die Grundkosten fehlt die Wohnfläche.':'');
if(S.vzHW!==''){const cs=['heizung','warm','kalt'].map(x=>hwCost(x,x===k?P:prog(x)));if(cs.every(Boolean)){const tot=cs.reduce((t,x)=>t+x.tot,0),vz=S.vzHW*months(P.a,P.b).length;

else L.push('✓ Verbrauch passt zu deinen Ablesungen');}

if(fin(o[p])){const gr=g&&fin(o[g])?(S.flaeche?o[g]*S.flaeche:null):0;

async function save(){const d=$('#date').value;fd=d;if(!d)return toast('Bitte ein Datum wählen');if(S.einzug&&d<S.einzug)return toast('Datum liegt vor dem Einzug');const todo=[];
for(const i of document.querySelectorAll('input[data-m]')){if(!i.value.trim())continue;const m=MM(i.dataset.m),v=num(i.value);
if(isNaN(v)||v<0)return toast('Ungültiger Wert bei '+m.s);

if(p&&v<p.v&&!confirm(m.s+': Der Wert ist niedriger als der vorherige Stand'+(p.d?' vom '+dl(p.d):'')+' ('+fm(p.v,m.d)+'). Trotzdem speichern?'))return;

todo.push([m,v])}

else if(k.startsWith('abr.')){const p=k.split('.'),y=p[1],n=num(v);if(v&&(isNaN(n)||n<0))return toast('Ungültiger Wert');
const o=S.abr[y]||(S.abr[y]={});let t=o,key=p[2];if(p[2]==='w'){t=o.w||(o.w={});key=p[3]}
if(v)t[key]=n;else delete t[key];if(o.w&&!Object.keys(o.w).length)delete o.w;if(!Object.keys(o).length)delete S.abr[y]}
else{const [o,id]=k.split('.');if(o==='fak'){const n=num(v);if(v&&(isNaN(n)||n<=0))return toast('Ungültiger Faktor');if(v)S.fak[id]=n;else delete S.fak[id]}else{if(v)S.nr[id]=v;else delete S.nr[id]}}
await saveS();if(rr)render();else{const x=$('#abrres');if(x&&ay)x.innerHTML=abrRes(ay)}toast('Gespeichert')});
